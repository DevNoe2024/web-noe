<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appar-Noe | Réservation d'appartements</title>

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

/* ================= HEADER ================= */

header{
    background:linear-gradient(to right,#0f2027,#203a43,#2c5364);
    padding:20px 60px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:500;
    transition:0.3s;
}

nav a:hover{
    color:#00c6ff;
}

/* ================= HERO ================= */

.hero{
    height:90vh;
    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=1500');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero-content{
    color:white;
    max-width:700px;
}

.hero-content h1{
    font-size:55px;
    margin-bottom:20px;
}

.hero-content p{
    font-size:20px;
    margin-bottom:30px;
}

/* ================= SEARCH ================= */

.search-box{
    padding:20px;
    border-radius:15px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.search-box select,
.search-box button{
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:15px;
}

.search-box select{
    width:240px;
    border:1px solid #ccc;
}

.search-box button{
    background:#00c6ff;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.search-box button:hover{
    background:#0095cc;
}

/* ================= SECTION ================= */

.section{
    

    padding:80px 40px;

    background:
    linear-gradient(
    rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)
    ),

    url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=1500');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;


}

.section-title{
    text-align:center;
    font-size:35px;
    margin-bottom:50px;
    color: aliceblue;
    position:relative;
}

.section-title::after{
    
    content:"";
    width:100px;
    height:4px;

    background:#00c6ff;

    display:block;
    margin:12px auto;
    border-radius:10px;


}

/* ================= CARDS ================= */

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
}

.card{
    width:320px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-12px) scale(1.02);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card-content h3{
    margin-bottom:10px;
    color:#0f2027;
}

.card-content p{
    margin-bottom:10px;
    color:#555;
}

.price{
    color:#00c6ff;
    font-size:20px;
    font-weight:bold;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    background:#00c6ff;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin-top:10px;
    transition:0.3s;
}

.btn:hover{
    background:#0095cc;
}

/* ================= RESERVATIONS ================= */

#reservations{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.resv{
    background:white;
    width:300px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.resv p{
    margin-bottom:8px;
}

.resv button{
    width:100%;
    padding:10px;
    border:none;
    background:red;
    color:white;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

/* ================= FORMULAIRE ================= */

.form-reservation{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.form-box{
    background:white;
    width:350px;
    padding:25px;
    border-radius:15px;
    animation:popup 0.3s ease;
}

@keyframes popup{
    from{
        transform:scale(0.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.form-box h3{
    margin-bottom:20px;
    text-align:center;
    color:#0f2027;
}

.form-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

.form-buttons{
    display:flex;
    gap:10px;
}

.form-buttons button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#valider{
    background:#00c6ff;
    color:white;
}

#fermer{
    background:red;
    color:white;
}

/* ================= FOOTER ================= */

footer{
    background:#0f2027;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    header{
        padding:20px;
        flex-direction:column;
        gap:15px;
    }

    .hero-content h1{
        font-size:38px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box select,
    .search-box button{
        width:100%;
    }

}

</style>

</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">Appar-Noe</div>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Appartements</a>
        <a href="#">Réservations</a>
        <a href="#">Contact</a>
    </nav>

</header>

<!-- HERO -->
<section class="hero">

    <div class="hero-content">

        <h1>Trouvez votre appartement idéal</h1>

        <p>Réservez rapidement des appartements modernes au Bénin</p>

        <div class="search-box">

            <select id="ville">

                <option value="">Choisir une ville</option>

                <option value="cotonou">Cotonou</option>
                <option value="porto-novo">Porto-Novo</option>
                <option value="parakou">Parakou</option>

            </select>

            <button id="rechercher">Rechercher</button>

        </div>

    </div>

</section>

<!-- APPARTEMENTS -->
<section class="section">

    <h2 class="section-title">Nos Appartements</h2>

    <div class="cards"></div>

</section>

<!-- RESERVATIONS -->
<section class="section">

    <h2 class="section-title">Mes Réservations</h2>

    <div id="reservations"></div>

</section>

<!-- FOOTER -->
<footer>

    <p>© 2026 Appar-Noe | Réservation d'appartements</p>

</footer>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
